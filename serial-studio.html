<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Serial Studio</title>
<style>
:root{
  --bg:#0f1115;--panel:#171a21;--panel2:#1d212a;--line:#2a2f3a;--text:#d7dce5;
  --dim:#808999;--accent:#4da3ff;--ok:#3ddc84;--bad:#ff5d5d;--warn:#ffb54d;--tx:#c792ea;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--text);font:14px/1.4 system-ui,Segoe UI,sans-serif;display:flex;flex-direction:column}
button,input,select{font:inherit;color:inherit;background:var(--panel2);border:1px solid var(--line);border-radius:6px;padding:5px 9px}
button{cursor:pointer}
button:hover:not(:disabled){border-color:var(--accent)}
button:disabled{opacity:.45;cursor:not-allowed}
button.primary{background:var(--accent);border-color:var(--accent);color:#04121f;font-weight:600}
button.danger{background:var(--bad);border-color:var(--bad);color:#200404;font-weight:600}
button.on{border-color:var(--accent);color:var(--accent)}
label.chk{display:inline-flex;align-items:center;gap:5px;color:var(--dim);cursor:pointer;user-select:none}
input[type=checkbox]{accent-color:var(--accent)}
input[type=number]{width:80px}
header{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:10px 14px;border-bottom:1px solid var(--line);background:var(--panel)}
header h1{font-size:15px;margin:0 8px 0 0;letter-spacing:.3px}
.sp{flex:1}
.status{display:inline-flex;align-items:center;gap:6px;color:var(--dim)}
.dot{width:9px;height:9px;border-radius:50%;background:var(--bad)}
.dot.on{background:var(--ok)}
#adv{display:none;flex-wrap:wrap;gap:10px;align-items:center;padding:8px 14px;border-bottom:1px solid var(--line);background:var(--panel)}
#adv.show{display:flex}
#adv label{color:var(--dim);display:inline-flex;gap:5px;align-items:center}
#banner{display:none;background:#3a2410;color:var(--warn);padding:10px 14px}
main{flex:1;min-height:0;display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:10px}
main.v-mon{grid-template-columns:1fr}main.v-mon #plotPane{display:none}
main.v-plot{grid-template-columns:1fr}main.v-plot #monPane{display:none}
@media(max-width:900px){main{grid-template-columns:1fr;grid-auto-rows:minmax(0,1fr)}}
.pane{display:flex;flex-direction:column;min-height:0;min-width:0;background:var(--panel);border:1px solid var(--line);border-radius:8px;overflow:hidden}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:7px 10px;border-bottom:1px solid var(--line)}
.bar b{font-size:13px}
#mon{flex:1;min-height:0;overflow:auto;padding:8px 10px;font:12.5px/1.45 Consolas,Menlo,monospace;white-space:pre-wrap;word-break:break-all}
#mon .l{display:block}
#mon .t{color:var(--dim);margin-right:8px;display:none}
#mon.ts .t{display:inline}
#mon .tx{color:var(--tx)}
#mon .sys{color:var(--warn)}
#send{display:flex;gap:8px;padding:8px 10px;border-top:1px solid var(--line)}
#send input[type=text]{flex:1;min-width:0;font-family:Consolas,monospace}
#plotWrap{position:relative;flex:1;min-height:0}
#plot{position:absolute;inset:0;width:100%;height:100%}
#legend{display:flex;flex-wrap:wrap;gap:6px;padding:6px 10px;border-top:1px solid var(--line);min-height:36px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:2px 9px;border-radius:99px;border:1px solid var(--line);cursor:pointer;user-select:none;font-size:12.5px}
.chip i{width:10px;height:10px;border-radius:50%}
.chip.off{opacity:.4;text-decoration:line-through}
.hint{color:var(--dim);font-size:12px}
.stats{color:var(--dim);font-size:12px}
</style>
</head>
<body>
<header>
  <h1>Serial Studio</h1>
  <button id="btnConnect" class="primary">Connect…</button>
  <button id="btnAuto" title="Try common baud rates and pick the one that gives readable text">Auto-detect baud</button>
  <label class="status">Baud
    <input id="baud" type="text" list="bauds" value="115200" size="8">
    <datalist id="bauds"><option>300<option>1200<option>2400<option>4800<option>9600<option>19200<option>38400<option>57600<option>74880<option>115200<option>230400<option>250000<option>460800<option>500000<option>921600<option>1000000<option>2000000</datalist>
  </label>
  <button id="btnAdv">Settings ▾</button>
  <span class="sp"></span>
  <span class="status"><span id="dot" class="dot"></span><span id="stat">Disconnected</span></span>
  <span class="stats" id="rate"></span>
  <span class="status">
    <button data-view="split" class="on">Split</button>
    <button data-view="mon">Monitor</button>
    <button data-view="plot">Plotter</button>
  </span>
</header>
<div id="adv">
  <label>Data bits <select id="dataBits"><option>8<option>7</select></label>
  <label>Parity <select id="parity"><option>none<option>even<option>odd</select></label>
  <label>Stop bits <select id="stopBits"><option>1<option>2</select></label>
  <label>Flow control <select id="flow"><option>none<option>hardware</select></label>
  <button id="btnDtr" disabled>DTR</button>
  <button id="btnRts" disabled>RTS</button>
  <span class="hint">DTR toggling resets most Arduino-style boards.</span>
</div>
<div id="banner">This browser has no Web Serial support. Open this file in Chrome, Edge or Opera (desktop).</div>

<main id="main">
  <section class="pane" id="monPane">
    <div class="bar">
      <b>Monitor</b>
      <label class="chk"><input type="checkbox" id="optTs"> Timestamps</label>
      <label class="chk"><input type="checkbox" id="optScroll" checked> Autoscroll</label>
      <label class="chk"><input type="checkbox" id="optHex"> Hex</label>
      <span class="sp"></span>
      <button id="btnSaveLog">Save log</button>
      <button id="btnClearMon">Clear</button>
    </div>
    <div id="mon"></div>
    <form id="send" autocomplete="off">
      <input type="text" id="sendText" placeholder="Send to device… (↑/↓ for history)" disabled>
      <select id="eol"><option value="">No line end<option value="\n" selected>Newline<option value="\r">Carriage return<option value="\r\n">Both CR+LF</select>
      <button id="btnSend" disabled>Send</button>
    </form>
  </section>

  <section class="pane" id="plotPane">
    <div class="bar">
      <b>Plotter</b>
      <label class="chk">Points <input type="number" id="win" value="500" min="10" max="20000"></label>
      <label class="chk">Y min <input type="number" id="ymin" placeholder="auto"></label>
      <label class="chk">Y max <input type="number" id="ymax" placeholder="auto"></label>
      <span class="sp"></span>
      <button id="btnPause">Pause</button>
      <button id="btnCsv">Export CSV</button>
      <button id="btnClearPlot">Clear</button>
    </div>
    <div id="plotWrap"><canvas id="plot"></canvas></div>
    <div id="legend"><span class="hint">Send lines like <code>12,34,56</code> or <code>temp:23.5 hum:40</code> — each number becomes a trace.</span></div>
  </section>
</main>

<script>
'use strict';
const $ = id => document.getElementById(id);
const VENDORS = {0x2341:'Arduino',0x2A03:'Arduino',0x1A86:'CH340/CH341',0x10C4:'CP210x (Silicon Labs)',0x0403:'FTDI',0x067B:'Prolific',
  0x239A:'Adafruit',0x303A:'Espressif',0x2E8A:'Raspberry Pi',0x0483:'STMicroelectronics',0x1366:'SEGGER',0x16C0:'PJRC/Teensy',0x1D50:'OpenMoko/Black Magic',0x04D8:'Microchip'};

if (!('serial' in navigator)) $('banner').style.display = 'block';

/* ---------------- state ---------------- */
let port = null, reader = null, readTask = null, keepReading = false, busy = false;
let decoder = new TextDecoder('utf-8', {fatal:false});
let pending = '';
let rxBytes = 0, lastRx = 0, lastTick = performance.now();
let sigs = {dataTerminalReady:false, requestToSend:false};
const history = []; let histIdx = 0;

/* ---------------- helpers ---------------- */
function portLabel(p){
  const i = p.getInfo ? p.getInfo() : {};
  if (i.usbVendorId === undefined) return 'Serial port';
  const v = VENDORS[i.usbVendorId] || 'USB ' + i.usbVendorId.toString(16).padStart(4,'0').toUpperCase();
  return `${v} (${i.usbVendorId.toString(16).padStart(4,'0')}:${(i.usbProductId||0).toString(16).padStart(4,'0')})`;
}
function setStatus(text, on){ $('stat').textContent = text; $('dot').classList.toggle('on', !!on); }
function ui(connected){
  $('btnConnect').textContent = connected ? 'Disconnect' : 'Connect…';
  $('btnConnect').classList.toggle('primary', !connected);
  $('btnConnect').classList.toggle('danger', connected);
  for (const id of ['sendText','btnSend','btnDtr','btnRts']) $(id).disabled = !connected;
  $('btnAuto').disabled = connected;
  for (const id of ['baud','dataBits','parity','stopBits','flow']) $(id).disabled = connected;
}
function serialOpts(baud){
  return { baudRate: baud, dataBits: +$('dataBits').value, parity: $('parity').value,
           stopBits: +$('stopBits').value, flowControl: $('flow').value, bufferSize: 65536 };
}
function getBaud(){
  const b = parseInt($('baud').value, 10);
  if (!(b > 0)) throw new Error('Enter a valid baud rate');
  return b;
}

/* ---------------- monitor ---------------- */
const mon = $('mon');
const pendEl = document.createElement('span'); pendEl.className = 'l';
mon.appendChild(pendEl);
const MAX_LINES = 4000;
const logLines = [];  // for saving
let dirtyMon = false;
const queue = [];

function ts(){ const d = new Date(); return d.toTimeString().slice(0,8) + '.' + String(d.getMilliseconds()).padStart(3,'0'); }
function addLine(text, cls){
  queue.push({text, cls, t: ts()});
  logLines.push(`[${ts()}] ${text}`);
  if (logLines.length > 200000) logLines.splice(0, 20000);
  dirtyMon = true;
}
function flushMonitor(){
  if (!dirtyMon && pendEl.dataset.v === pending) return;
  const stick = $('optScroll').checked;
  for (const q of queue.splice(0)){
    const row = document.createElement('span'); row.className = 'l' + (q.cls ? ' ' + q.cls : '');
    const t = document.createElement('span'); t.className = 't'; t.textContent = q.t;
    row.append(t, document.createTextNode(q.text));
    mon.insertBefore(row, pendEl);
  }
  while (mon.childElementCount > MAX_LINES + 1) mon.removeChild(mon.firstChild);
  pendEl.textContent = pending; pendEl.dataset.v = pending;
  dirtyMon = false;
  if (stick) mon.scrollTop = mon.scrollHeight;
}

/* ---------------- incoming data ---------------- */
function onBytes(bytes){
  rxBytes += bytes.length;
  const text = decoder.decode(bytes, {stream:true});
  if ($('optHex').checked){
    addLine([...bytes].map(b => b.toString(16).padStart(2,'0')).join(' '));
  }
  pending += text;
  if (pending.length > 100000) pending = pending.slice(-50000);  // device never sends newline
  const parts = pending.split('\n');
  pending = parts.pop();
  for (let line of parts){
    if (line.endsWith('\r')) line = line.slice(0,-1);
    if (!$('optHex').checked) addLine(line);
    plotLine(line);
  }
  dirtyMon = true;
}

async function readLoop(){
  while (port && port.readable && keepReading){
    reader = port.readable.getReader();
    try {
      for(;;){
        const {value, done} = await reader.read();
        if (done) break;
        if (value && value.length) onBytes(value);
      }
    } catch (e) {
      if (keepReading) addLine('Read error: ' + e.message, 'sys');
    } finally {
      try { reader.releaseLock(); } catch {}
      reader = null;
    }
  }
}

/* ---------------- connect / disconnect ---------------- */
async function connect(p){
  const baud = getBaud();
  await p.open(serialOpts(baud));
  port = p; keepReading = true; pending = ''; decoder = new TextDecoder('utf-8', {fatal:false});
  rxBytes = 0; sigs = {dataTerminalReady:false, requestToSend:false};
  $('btnDtr').classList.remove('on'); $('btnRts').classList.remove('on');
  ui(true);
  setStatus(`Connected — ${portLabel(p)} @ ${baud}`, true);
  addLine(`— connected: ${portLabel(p)} @ ${baud} baud —`, 'sys');
  readTask = readLoop().then(() => { if (keepReading) disconnect(true); });
}

async function disconnect(lost){
  if (busy && !lost) return;
  keepReading = false;
  try { if (reader) await reader.cancel(); } catch {}
  try { await readTask; } catch {}
  try { if (port) await port.close(); } catch {}
  port = null; readTask = null;
  ui(false);
  setStatus(lost ? 'Device disconnected' : 'Disconnected', false);
  addLine(lost ? '— device lost —' : '— disconnected —', 'sys');
}

$('btnConnect').onclick = async () => {
  if (port){ await disconnect(); return; }
  if (!navigator.serial) return;
  try {
    getBaud();
    const p = await navigator.serial.requestPort();   // no filter: every serial device is listed
    await connect(p);
  } catch (e) {
    if (e.name !== 'NotFoundError'){ setStatus('Error: ' + e.message, false); addLine('Error: ' + e.message, 'sys'); }
  }
};

navigator.serial && navigator.serial.addEventListener('disconnect', e => { if (e.target === port) disconnect(true); });

/* ---------------- auto-detect baud ---------------- */
const RATES = [115200, 9600, 57600, 38400, 19200, 230400, 460800, 921600, 74880, 4800, 2400, 250000, 500000, 1000000, 1200];
$('btnAuto').onclick = async () => {
  if (port || busy) return;
  let p;
  try { p = await navigator.serial.requestPort(); } catch { return; }
  busy = true; $('btnAuto').disabled = true; $('btnConnect').disabled = true;
  let best = null;
  try {
    for (const rate of RATES){
      setStatus(`Probing ${rate}…`, false);
      try { await p.open(serialOpts(rate)); } catch (e) { addLine(`Cannot open at ${rate}: ${e.message}`, 'sys'); continue; }
      const r = p.readable.getReader(); const buf = [];
      const timer = setTimeout(() => r.cancel().catch(()=>{}), 1100);
      try { for(;;){ const {value, done} = await r.read(); if (done) break; if (value) buf.push(...value); } } catch {}
      clearTimeout(timer); try { r.releaseLock(); } catch {}
      try { await p.close(); } catch {}
      if (buf.length >= 4){
        const ok = buf.filter(b => (b >= 32 && b < 127) || b === 10 || b === 13 || b === 9).length / buf.length;
        if (!best || ok > best.score) best = {rate, score: ok, n: buf.length};
        if (ok > 0.97 && buf.length >= 16) break;
      }
    }
    if (best && best.score > 0.9){
      $('baud').value = best.rate;
      addLine(`Auto-detect: ${best.rate} baud looks right (${(best.score*100).toFixed(0)}% readable, ${best.n} bytes)`, 'sys');
      busy = false;
      await connect(p);
    } else {
      setStatus('No readable data at common baud rates', false);
      addLine('Auto-detect found nothing readable. The device may only talk after you send something — pick the baud manually and connect.', 'sys');
    }
  } catch (e) { setStatus('Error: ' + e.message, false); }
  busy = false; $('btnConnect').disabled = false; $('btnAuto').disabled = !!port;
};

/* ---------------- sending ---------------- */
$('send').onsubmit = async ev => {
  ev.preventDefault();
  if (!port || !port.writable) return;
  const text = $('sendText').value;
  const eol = $('eol').value.replace('\\n','\n').replace('\\r','\r');
  try {
    const w = port.writable.getWriter();
    try { await w.write(new TextEncoder().encode(text + eol)); } finally { w.releaseLock(); }
    addLine('→ ' + text, 'tx');
    if (text && history[history.length-1] !== text) history.push(text);
    histIdx = history.length; $('sendText').value = '';
  } catch (e) { addLine('Write error: ' + e.message, 'sys'); }
};
$('sendText').onkeydown = e => {
  if (e.key === 'ArrowUp' && history.length){ histIdx = Math.max(0, histIdx-1); e.target.value = history[histIdx]; e.preventDefault(); }
  if (e.key === 'ArrowDown' && history.length){ histIdx = Math.min(history.length, histIdx+1); e.target.value = history[histIdx] || ''; e.preventDefault(); }
};
for (const [id, key] of [['btnDtr','dataTerminalReady'],['btnRts','requestToSend']]){
  $(id).onclick = async () => {
    sigs[key] = !sigs[key];
    try { await port.setSignals({[key]: sigs[key]}); $(id).classList.toggle('on', sigs[key]); }
    catch (e) { sigs[key] = !sigs[key]; addLine('setSignals failed: ' + e.message, 'sys'); }
  };
}

/* ---------------- monitor buttons ---------------- */
$('optTs').onchange = e => mon.classList.toggle('ts', e.target.checked);
$('btnClearMon').onclick = () => { for (const n of [...mon.children]) if (n !== pendEl) n.remove(); logLines.length = 0; pending = ''; dirtyMon = true; };
$('btnSaveLog').onclick = () => download('serial-log.txt', logLines.join('\n'), 'text/plain');
function download(name, content, type){
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([content], {type}));
  a.download = name; a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}

/* ---------------- view / settings toggles ---------------- */
$('btnAdv').onclick = () => $('adv').classList.toggle('show');
document.querySelectorAll('[data-view]').forEach(b => b.onclick = () => {
  document.querySelectorAll('[data-view]').forEach(x => x.classList.toggle('on', x === b));
  $('main').className = b.dataset.view === 'split' ? '' : 'v-' + b.dataset.view;
  dirtyPlot = true;
});

/* ---------------- plotter ---------------- */
const COLORS = ['#4da3ff','#ff6b6b','#3ddc84','#ffb54d','#c792ea','#2ee6d6','#f78fb3','#d4e157','#ff8a50','#9fa8da'];
const rows = [];            // {v:{name:number}}
const names = [];           // series in order of first appearance
const hidden = new Set();
let paused = false, dirtyPlot = true, hoverX = null;
const NUM = '-?\\d+(?:\\.\\d+)?(?:[eE][+-]?\\d+)?';
const KV = new RegExp('([A-Za-z_]\\w*)\\s*[:=]\\s*(' + NUM + ')', 'g');
const NUMS = new RegExp(NUM, 'g');

function plotLine(line){
  if (paused) return;
  const v = {};
  let found = false;
  for (const m of line.matchAll(KV)){ v[m[1]] = parseFloat(m[2]); found = true; }
  if (!found){
    const nums = line.match(NUMS);
    if (!nums) return;
    nums.slice(0, 16).forEach((n, i) => v['ch' + (i+1)] = parseFloat(n));
  }
  for (const k in v) if (!names.includes(k)){ names.push(k); renderLegend(); }
  rows.push(v);
  if (rows.length > 60000) rows.splice(0, 10000);
  dirtyPlot = true;
}
function renderLegend(){
  const lg = $('legend'); lg.innerHTML = '';
  names.forEach((n, i) => {
    const c = document.createElement('span');
    c.className = 'chip' + (hidden.has(n) ? ' off' : '');
    c.innerHTML = '<i style="background:' + COLORS[i % COLORS.length] + '"></i>';
    c.append(n);
    c.onclick = () => { hidden.has(n) ? hidden.delete(n) : hidden.add(n); renderLegend(); dirtyPlot = true; };
    lg.appendChild(c);
  });
}
$('btnPause').onclick = e => { paused = !paused; e.target.textContent = paused ? 'Resume' : 'Pause'; e.target.classList.toggle('on', paused); };
$('btnClearPlot').onclick = () => { rows.length = 0; names.length = 0; hidden.clear(); $('legend').innerHTML = ''; dirtyPlot = true; };
$('btnCsv').onclick = () => {
  if (!rows.length) return;
  const out = ['sample,' + names.join(',')];
  rows.forEach((r, i) => out.push(i + ',' + names.map(n => r[n] === undefined ? '' : r[n]).join(',')));
  download('serial-plot.csv', out.join('\n'), 'text/csv');
};
for (const id of ['win','ymin','ymax']) $(id).oninput = () => dirtyPlot = true;

const cv = $('plot'), ctx = cv.getContext('2d');
new ResizeObserver(() => {
  const r = cv.getBoundingClientRect(), d = devicePixelRatio || 1;
  cv.width = Math.max(1, r.width * d); cv.height = Math.max(1, r.height * d);
  dirtyPlot = true;
}).observe($('plotWrap'));
cv.onmousemove = e => { hoverX = e.offsetX; dirtyPlot = true; };
cv.onmouseleave = () => { hoverX = null; dirtyPlot = true; };

function niceStep(range, n){
  const raw = range / n, p = Math.pow(10, Math.floor(Math.log10(raw))), f = raw / p;
  return (f < 1.5 ? 1 : f < 3.5 ? 2 : f < 7.5 ? 5 : 10) * p;
}
function css(v){ return getComputedStyle(document.documentElement).getPropertyValue(v).trim(); }

function drawPlot(){
  const d = devicePixelRatio || 1, W = cv.width / d, H = cv.height / d;
  ctx.setTransform(d, 0, 0, d, 0, 0);
  ctx.clearRect(0, 0, W, H);
  const L = 54, R = 12, T = 12, B = 22, w = W - L - R, h = H - T - B;
  if (w < 20 || h < 20) return;
  const N = Math.max(10, parseInt($('win').value, 10) || 500);
  const start = Math.max(0, rows.length - N);
  const vis = rows.slice(start);
  const active = names.filter(n => !hidden.has(n));

  let lo = Infinity, hi = -Infinity;
  for (const r of vis) for (const n of active) if (r[n] !== undefined){ if (r[n] < lo) lo = r[n]; if (r[n] > hi) hi = r[n]; }
  if (lo === Infinity){ lo = 0; hi = 1; }
  if (lo === hi){ lo -= 1; hi += 1; }
  const pad = (hi - lo) * 0.06; lo -= pad; hi += pad;
  const ymin = $('ymin').value !== '' ? +$('ymin').value : lo;
  const ymax = $('ymax').value !== '' ? +$('ymax').value : hi;
  const span = (ymax - ymin) || 1;
  const X = i => L + (N <= 1 ? 0 : (i + (N - vis.length)) / (N - 1) * w);
  const Y = v => T + h - (v - ymin) / span * h;

  ctx.font = '11px system-ui'; ctx.textBaseline = 'middle';
  const step = niceStep(span, Math.max(2, h / 40));
  ctx.strokeStyle = css('--line'); ctx.fillStyle = css('--dim'); ctx.lineWidth = 1; ctx.textAlign = 'right';
  for (let v = Math.ceil(ymin / step) * step; v <= ymax; v += step){
    const y = Math.round(Y(v)) + .5;
    ctx.beginPath(); ctx.moveTo(L, y); ctx.lineTo(W - R, y); ctx.stroke();
    ctx.fillText(+v.toPrecision(6) + '', L - 6, y);
  }
  ctx.strokeRect(L + .5, T + .5, w, h);
  ctx.textAlign = 'center'; ctx.textBaseline = 'top';
  ctx.fillText('older', L + 20, T + h + 6); ctx.fillText('latest', W - R - 16, T + h + 6);

  ctx.save(); ctx.beginPath(); ctx.rect(L, T, w, h); ctx.clip();
  ctx.lineWidth = 1.6; ctx.lineJoin = 'round';
  names.forEach((n, ci) => {
    if (hidden.has(n)) return;
    ctx.strokeStyle = COLORS[ci % COLORS.length]; ctx.beginPath();
    let pen = false;
    vis.forEach((r, i) => {
      if (r[n] === undefined){ pen = false; return; }
      pen ? ctx.lineTo(X(i), Y(r[n])) : ctx.moveTo(X(i), Y(r[n])); pen = true;
    });
    ctx.stroke();
  });
  ctx.restore();

  if (hoverX !== null && hoverX >= L && hoverX <= W - R && vis.length){
    let i = Math.round((hoverX - L) / w * (N - 1)) - (N - vis.length);
    i = Math.min(vis.length - 1, Math.max(0, i));
    const x = X(i);
    ctx.strokeStyle = css('--dim'); ctx.setLineDash([4, 4]);
    ctx.beginPath(); ctx.moveTo(x, T); ctx.lineTo(x, T + h); ctx.stroke(); ctx.setLineDash([]);
    const items = names.map((n, ci) => [n, ci]).filter(([n]) => !hidden.has(n) && vis[i][n] !== undefined);
    if (items.length){
      const bw = 110, bh = items.length * 16 + 8, bx = x + 10 + bw > W ? x - bw - 10 : x + 10;
      ctx.fillStyle = css('--panel2'); ctx.strokeStyle = css('--line');
      ctx.fillRect(bx, T + 6, bw, bh); ctx.strokeRect(bx + .5, T + 6.5, bw, bh);
      ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
      items.forEach(([n, ci], k) => {
        ctx.fillStyle = COLORS[ci % COLORS.length];
        ctx.fillText(n + ': ' + vis[i][n], bx + 8, T + 18 + k * 16);
      });
    }
  }
}

/* ---------------- render loop ---------------- */
function frame(now){
  flushMonitor();
  if (dirtyPlot){ dirtyPlot = false; drawPlot(); }
  if (now - lastTick > 1000){
    const bps = (rxBytes - lastRx) / ((now - lastTick) / 1000);
    $('rate').textContent = port ? `${(bps / 1024).toFixed(1)} KB/s · ${rxBytes} B` : '';
    lastRx = rxBytes; lastTick = now;
  }
  requestAnimationFrame(frame);
}
ui(false);
requestAnimationFrame(frame);
</script>
</body>
